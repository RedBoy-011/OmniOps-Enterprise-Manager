[package]
name = "omniops-windows-edge-agent"
version = "2.4.0"
description = "Windows Edge Execution Arm for OmniOps Enterprise Manager (Coucou Fork)"
edition = "2021"

[lib]
name = "omniops_windows_edge_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "2.1", features = ["windows-native"] }
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Credentials"] }
