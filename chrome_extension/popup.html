<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>OmniOps Chrome Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 320px; background: #0e0e13; color: #e2e8f0; padding: 14px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #272733; padding-bottom: 10px; margin-bottom: 12px; }
    .logo-area { display: flex; align-items: center; gap: 8px; }
    .logo { width: 28px; height: 28px; background: #2563eb; color: #fff; font-weight: bold; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .title { font-size: 13px; font-weight: bold; color: #ffffff; }
    .version { font-size: 10px; color: #94a3b8; font-family: monospace; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 9999px; font-weight: bold; }
    .badge-online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-offline { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .card { background: #171720; border: 1px solid #272733; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; }
    .row:last-child { margin-bottom: 0; }
    .label { color: #94a3b8; }
    .value { font-weight: 600; color: #f1f5f9; font-family: monospace; }
    .btn { width: 100%; background: #2563eb; color: white; border: none; border-radius: 8px; padding: 8px 12px; font-size: 11px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #222230; color: #cbd5e1; border: 1px solid #333345; margin-top: 6px; }
    .btn-secondary:hover { background: #2a2a3b; color: #fff; }
    .footer { text-align: center; font-size: 10px; color: #64748b; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-area">
      <div class="logo">Ω</div>
      <div>
        <div class="title">OmniOps Assistant</div>
        <div class="version">Chrome Hook v2.4.1</div>
      </div>
    </div>
    <span id="agentBadge" class="badge badge-offline">در حال بررسی...</span>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">اتصال به ایجنت ویندوز:</span>
      <span id="agentStatus" class="value">نامشخص</span>
    </div>
    <div class="row">
      <span class="label">درگاه لیسنر محلی:</span>
      <span class="value">127.0.0.1:8443</span>
    </div>
    <div class="row">
      <span class="label">پروتکل ارتباطی:</span>
      <span class="value">WebSocket Hook</span>
    </div>
    <div class="row">
      <span class="label">تب فعال مرورگر:</span>
      <span id="activeTabTitle" class="value" style="max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</span>
    </div>
  </div>

  <button id="btnReconnect" class="btn">
    <span>تست و اتصال مجدد به ایجنت</span>
  </button>

  <button id="btnOpenDashboard" class="btn btn-secondary">
    <span>باز کردن پنل مرکزی OmniOps</span>
  </button>

  <div class="footer">
    اتصال امن درون‌شبکه‌ای بدون خروج داده خارج از سازمان
  </div>

  <script src="popup.js"></script>
</body>
</html>
